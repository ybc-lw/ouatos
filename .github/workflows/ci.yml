name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      upload_iso:
        description: "Upload the built installer ISO as a workflow artifact (3 days)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}-${{ inputs.upload_iso == true && 'upload' || 'no-upload' }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # ---------------------------------------------------------------------------
  # Fast checks: no ISO build, no rootfs unpacking. A few minutes.
  # ---------------------------------------------------------------------------
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: installer
    steps:
      - uses: actions/checkout@v4

      - name: Install Pillow
        run: sudo apt-get update && sudo apt-get install -y python3-pil initramfs-tools-core

      - name: Syntax check (Python + shell)
        run: |
          python3 -m compileall -q .
          bash -n tests/test_boot_path.sh

      - name: FAT writer
        run: |
          python3 tests/test_fat.py > /tmp/test_fat.log 2>&1 || { cat /tmp/test_fat.log; exit 1; }
          cat /tmp/test_fat.log
          if grep -q "BUG" /tmp/test_fat.log; then exit 1; fi

      - name: Installer safety regressions
        run: |
          python3 tests/test_safety.py
          python3 tests/test_text_confirmation.py
          python3 tests/test_audit.py
          python3 tests/test_live_fixture.py
          python3 tests/test_integrity.py
          python3 tests/test_boot_config.py

      - name: Input handling
        run: python3 tests/test_input.py

      # test_cursor / test_gui read os-release from /tmp/fakemedia/ouatos/.
      # Use the real file from the OS image so the checks match what ships.
      - name: Prepare fake installation medium
        run: |
          mkdir -p /tmp/fakemedia/ouatos
          cp ../rootfs/usr/lib/os-release /tmp/fakemedia/ouatos/os_release

      - name: Pointer / cursor
        run: python3 tests/test_cursor.py

      - name: GUI wizard (virtual screen)
        run: python3 tests/test_gui.py

      - name: Ownership / permission policy (needs root)
        run: sudo python3 tests/test_policy.py

      - name: Ownership / permission policy (needs root)
        run: |
          sudo python3 tests/test_policy.py
          sudo python3 tests/test_policy_image_listing.py

      - name: Upload GUI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-screenshots
          path: /tmp/shots
          if-no-files-found: ignore
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Slow checks: pack rootfs/, build the ISO, validate it, try a real install.
  # Needs root, chroot and loop devices (all available on GitHub-hosted runners).
  # ---------------------------------------------------------------------------
  build-iso:
    name: Build ISO and validate it
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TAR: /tmp/ouatos-rootfs.tar.xz
      ISO: /tmp/ouatos-installer.iso
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true          # rootfs/usr/local/bin/node is stored in Git LFS

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-pil fonts-dejavu-core e2fsprogs xz-utils initramfs-tools-core zstd

      - name: Pack rootfs/ into rootfs.tar.xz
        run: |
          tar --numeric-owner --owner=0 --group=0 -C rootfs -cf - . | xz -T0 -6 > "$TAR"
          ls -lh "$TAR"

      - name: Build the installer ISO
        working-directory: installer
        run: |
          sudo python3 build_iso.py "$TAR" "$ISO" 2>&1 | tee /tmp/build_iso.log
          if grep -q "Git LFS pointer" /tmp/build_iso.log; then
            echo "::error::rootfs contains Git LFS pointer stubs (git lfs pull was not run)"
            exit 1
          fi
          ls -lh "$ISO"

      - name: Validate ISO 9660 / Rock Ridge / El Torito / payload hash
        working-directory: installer
        run: sudo python3 tests/test_iso.py "$ISO" "$TAR"

      - name: Raw medium access (find by label, read payload without mounting)
        working-directory: installer
        run: sudo python3 tests/test_media.py "$ISO" "$TAR"

      - name: Live boot path (udev/kmod, /init finds the medium)
        working-directory: installer
        run: sudo env OUATOS_TEXT=1 bash tests/test_boot_path.sh "$ISO" /tmp/ouatos-build

      # Partitions and installs onto loop-backed disks, BIOS and UEFI.
      - name: End-to-end install onto a loop disk
        working-directory: installer
        run: |
          sudo OUATOS_TEST_TAR="$TAR" OUATOS_TEST_ISO="$ISO" OUATOS_TEST_MKE2FS=/usr/sbin/mke2fs \
            python3 tests/test_engine.py

      - name: Install using only live initramfs tools
        working-directory: installer
        run: sudo python3 tests/test_live.py

      # -----------------------------------------------------------------------
      # Full VM test: boot the ISO in QEMU, run the installer, then reboot from
      # the installed disk (no ISO) and check that the system comes up.
      # -----------------------------------------------------------------------
      - name: Install QEMU and OVMF
        run: sudo apt-get install -y qemu-system-x86 qemu-utils ovmf

      # Hosted Linux runners expose /dev/kvm but it is root-only by default.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || echo "no /dev/kvm, falling back to TCG (slow)"

      - name: VM install + boot (BIOS)
        working-directory: installer
        run: sudo python3 tests/test_vm.py "$ISO" --firmware bios --workdir /tmp/vmtest-bios --build-dir /tmp/ouatos-build

      - name: VM install + boot (UEFI)
        working-directory: installer
        run: sudo python3 tests/test_vm.py "$ISO" --firmware uefi --workdir /tmp/vmtest-uefi --build-dir /tmp/ouatos-build

      - name: Upload VM serial logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vm-debug
          path: |
            /tmp/vmtest-*/*.log
            /tmp/vmtest-*/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload ISO
        if: ${{ inputs.upload_iso == true }}
        uses: actions/upload-artifact@v4
        with:
          name: ouatos-xxx-installer-amd64-iso
          path: ${{ env.ISO }}
          retention-days: 3
