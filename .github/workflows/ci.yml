name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  installer-iso:
    name: build and test the ouatos installer iso
    runs-on: ubuntu-24.04
    # Require manual approval via GitHub Environment protection rules (Settings -> Environments -> ci-approval).
    environment: ci-approval
    # Without /dev/kvm QEMU falls back to software emulation (about 5x slower).
    timeout-minutes: 240

    steps:
      - name: Free disk space
        # The rootfs, its archive, an unpacked copy, the iso and the VM disk all exist at the same time.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - name: Check out (with git lfs files)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install dependencies
        # python3-pil + fonts-dejavu-core: glyph atlas; e2fsprogs: mke2fs bundled into the installer;
        # initramfs-tools-core: lsinitramfs; qemu-system-x86 + ovmf: the installation test (UEFI firmware).
        # scripts/build.py itself runs in a debian trixie container, see the next step.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3 python3-pil fonts-dejavu-core \
            xz-utils tar e2fsprogs util-linux udev kmod \
            initramfs-tools-core \
            qemu-system-x86 ovmf
          if [ -e /dev/kvm ]; then
            echo "KVM is available"
          else
            echo "::warning title=no KVM::/dev/kvm is missing, QEMU will use software emulation (slow)"
          fi

      - name: Build the rootfs (scripts/build.py)
        # debootstrap needs a current debian keyring for trixie, so scripts/build.py runs inside a privileged
        # debian trixie container (it needs mount, chroot and debootstrap).  It installs debootstrap itself
        # when it is missing; python3 and the keyring are installed here.
        run: |
          docker run --rm --privileged -v "$PWD":/work -w /work debian:trixie bash -euxo pipefail -c '
            export DEBIAN_FRONTEND=noninteractive
            apt-get update
            apt-get install -y --no-install-recommends python3 debootstrap debian-archive-keyring ca-certificates
            python3 scripts/build.py
          '
          sudo du -sh rootfs

      - name: Package rootfs.tar.xz
        # Keep owners, modes and xattrs: the installer fixes none of them.
        run: |
          mounts=$(findmnt -rn -o TARGET || true)
          if grep -q "^$PWD/rootfs" <<< "$mounts"; then
            echo "::error::rootfs still has mounts below it"; exit 1
          fi
          sudo tar --numeric-owner --xattrs --xattrs-include='*' -C rootfs -cpf - . | xz -T0 > rootfs.tar.xz
          ls -lh rootfs.tar.xz
          sudo rm -rf rootfs
          df -h /

      - name: Build the installer iso (build_iso.py)
        # Without an output argument the file is named ouatos-<VERSION_ID>-installer-amd64.iso.
        run: |
          sudo python3 installer/build_iso.py rootfs.tar.xz
          rm -f rootfs.tar.xz
          ls -lh ouatos-*-installer-amd64.iso

      - name: Install in QEMU and check the installed system
        # Installs the iso into a virtual disk, boots the installed system and, over the serial console, reads
        # /proc/meminfo (the whole system must use < 500 MiB: an error is reported but the remaining checks still
        # run) and runs node --version, pnpm --version and llama-server --version.  The step fails at the end if
        # any check failed; later steps (artifact uploads) run regardless.
        run: |
          iso=$(ls ouatos-*-installer-amd64.iso)
          sudo -E env "PATH=$PATH" python3 installer/tests/test_vm.py "$iso" \
            --workdir "$RUNNER_TEMP/vmtest" --guest-checks --max-used-mib 500

      - name: Upload qemu logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ouatos-qemu-logs
          path: |
            ${{ runner.temp }}/vmtest/*.log
            ${{ runner.temp }}/vmtest/*.png
            ${{ runner.temp }}/vmtest/guest-checks.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload the installer iso
        if: ${{ !cancelled() && hashFiles('ouatos-*-installer-amd64.iso') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ouatos-installer-iso
          path: ouatos-*-installer-amd64.iso
          if-no-files-found: error
          compression-level: 0   # the payload inside is already xz-compressed
          retention-days: 14
